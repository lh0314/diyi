<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能手表用户功能偏好交互式柱形图</title>
<style>
  :root {
    --bg: #f3f6fb;
    --card: #ffffff;
    --text: #22324d;
    --muted: #6b7a90;
    --line: #dbe4f0;
    --accent: #4b78d1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef4ff 0%, #f7f9fc 100%);
    color: var(--text);
    padding: 24px;
  }
  .wrap { max-width: 940px; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 14px 32px rgba(33, 63, 125, .10);
    overflow: hidden;
    border: 1px solid #e9eef8;
  }
  .hero {
    padding: 26px 28px 18px;
    background: linear-gradient(135deg, #eaf1ff 0%, #f8fbff 100%);
    border-bottom: 1px solid #edf1f7;
  }
  .hero h1 { margin: 0; font-size: 28px; }
  .hero p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .badges { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .badge { background: #fff; border: 1px solid #e6ecf7; border-radius: 14px; padding: 10px 14px; min-width: 180px; }
  .badge b { display: block; font-size: 22px; color: #355fb1; margin-bottom: 4px; }
  .body { padding: 24px 28px 26px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar h2 { margin: 0; font-size: 18px; }
  .btns { display: flex; gap: 10px; }
  button { border: 1px solid #d7e2f3; background: #fff; color: #365ca5; border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button.active { background: #4f7fd9; color: #fff; border-color: #4f7fd9; }
  #chartBox { position: relative; border: 1px solid #edf1f7; border-radius: 16px; background: #fcfdff; padding: 16px 16px 8px; }
  svg { width: 100%; height: auto; display: block; }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -100%);
    background: rgba(30, 45, 72, .95); color: #fff; padding: 8px 10px; border-radius: 10px; font-size: 13px;
    transition: opacity .15s ease; white-space: nowrap;
  }
  .summary { margin-top: 16px; background: #f5f8fe; border-left: 4px solid #5b89e6; padding: 14px 16px; border-radius: 10px; color: #43546d; line-height: 1.8; }
  .footer { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .hero, .body { padding-left: 16px; padding-right: 16px; }
    .hero h1 { font-size: 22px; }
    .badge { min-width: unset; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hero">
      <h1>智能手表用户功能偏好交互图</h1>
      <p>样本量 N = 50。统计“触控操作、语音助手、健康监测、GPS定位”四项功能中选择“是”的人数，支持鼠标悬停查看详细数据，并可切换人数/占比显示。</p>
      <div class="badges">
        <div class="badge"><b>32人</b><span>最高偏好：健康监测</span></div>
        <div class="badge"><b>64%</b><span>健康监测对应占比</span></div>
        <div class="badge"><b>3人</b><span>最高值与最低值差距</span></div>
      </div>
    </div>
    <div class="body">
      <div class="toolbar">
        <h2>四项功能偏好柱形对比</h2>
        <div class="btns">
          <button id="btnCount" class="active">显示人数</button>
          <button id="btnPct">显示占比</button>
        </div>
      </div>
      <div id="chartBox">
        <div id="tooltip" class="tooltip"></div>
        <svg id="svgChart" viewBox="0 0 860 430" aria-label="智能手表用户功能偏好柱形图"></svg>
      </div>
      <div class="summary"><strong>数据结论：</strong>健康监测为最受欢迎功能（32人，64%），GPS定位（31人，62%）和触控操作（30人，60%）紧随其后，语音助手为29人（58%）。整体差距较小，说明用户对核心功能的需求较为均衡。</div>
      <div class="footer">
        <span>数据来源：用户偏好调查数据.xlsx</span>
        <span>技术实现：HTML + SVG + 原生 JavaScript</span>
      </div>
    </div>
  </div>
</div>
<script>
const rawData = [
  { label: '触控操作', count: 30, color: '#5B8FF9' },
  { label: '语音助手', count: 29, color: '#F6BD16' },
  { label: '健康监测', count: 32, color: '#61DDAA' },
  { label: 'GPS定位', count: 31, color: '#E8684A' }
];
let mode = 'count';
const svg = document.getElementById('svgChart');
const tip = document.getElementById('tooltip');
const btnCount = document.getElementById('btnCount');
const btnPct = document.getElementById('btnPct');
const W = 860, H = 430;
const margin = { top: 30, right: 20, bottom: 80, left: 60 };
const plotW = W - margin.left - margin.right;
const plotH = H - margin.top - margin.bottom;
function createEl(name, attrs={}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function render() {
  svg.innerHTML = '';
  const max = mode === 'count' ? 40 : 80;
  const ticks = mode === 'count' ? [0,10,20,30,40] : [0,20,40,60,80];
  ticks.forEach(t => {
    const y = margin.top + plotH - t / max * plotH;
    svg.appendChild(createEl('line', { x1: margin.left, y1: y, x2: W-margin.right, y2: y, stroke: '#e3eaf4' }));
    const txt = createEl('text', { x: margin.left - 10, y: y + 5, 'text-anchor': 'end', fill: '#7a879b', 'font-size': '12' });
    txt.textContent = t;
    svg.appendChild(txt);
  });
  const step = plotW / rawData.length;
  const barW = 110;
  rawData.forEach((d, i) => {
    const value = mode === 'count' ? d.count : Math.round(d.count / 50 * 100);
    const barH = value / max * plotH;
    const x = margin.left + i * step + (step - barW) / 2;
    const y = margin.top + plotH - barH;
    const bar = createEl('rect', { x, y, width: barW, height: barH, rx: 14, fill: d.color, cursor: 'pointer' });
    bar.dataset.label = d.label;
    bar.dataset.count = d.count;
    bar.dataset.pct = Math.round(d.count/50*100);
    bar.addEventListener('mousemove', (e) => {
      tip.style.opacity = 1;
      tip.style.left = (e.offsetX + 18) + 'px';
      tip.style.top = (e.offsetY + 6) + 'px';
      tip.innerHTML = `${d.label}<br>人数：${d.count}人<br>占比：${Math.round(d.count/50*100)}%`;
    });
    bar.addEventListener('mouseleave', () => tip.style.opacity = 0);
    bar.addEventListener('click', () => alert(`${d.label}
偏好人数：${d.count}人
占比：${Math.round(d.count/50*100)}%`));
    svg.appendChild(bar);
    const vText = createEl('text', { x: x + barW/2, y: y - 10, 'text-anchor': 'middle', fill: '#2d3c55', 'font-size': '15', 'font-weight': '700' });
    vText.textContent = mode === 'count' ? `${d.count}人` : `${Math.round(d.count/50*100)}%`;
    svg.appendChild(vText);
    const labelText = createEl('text', { x: x + barW/2, y: H - 30, 'text-anchor': 'middle', fill: '#30415d', 'font-size': '14', 'font-weight': '600' });
    labelText.textContent = d.label;
    svg.appendChild(labelText);
  });
  const yLabel = createEl('text', { x: 20, y: margin.top + plotH/2, transform: `rotate(-90 20 ${margin.top + plotH/2})`, fill: '#64748b', 'font-size': '13' });
  yLabel.textContent = mode === 'count' ? '偏好人数（人）' : '偏好占比（%）';
  svg.appendChild(yLabel);
}
btnCount.onclick = () => { mode='count'; btnCount.classList.add('active'); btnPct.classList.remove('active'); render(); };
btnPct.onclick = () => { mode='pct'; btnPct.classList.add('active'); btnCount.classList.remove('active'); render(); };
render();
</script>
</body>
</html>
