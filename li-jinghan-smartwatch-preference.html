<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183f3b"><title>智能手表用户功能偏好图</title>
<style>
:root{--ink:#203b38;--muted:#70817c;--paper:#f3f6f3;--line:#dce5df;--teal:#276c64;--orange:#e18c52}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf3ef,#f7f8f4);font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);padding:22px}
.wrap{max-width:980px;margin:0 auto}.hero{background:#183f3b;color:#fff;padding:28px 30px;border-radius:22px 22px 0 0;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #ffffff25;border-radius:50%;right:-45px;top:-105px;box-shadow:0 0 0 28px #ffffff0d,0 0 0 58px #ffffff09}.eyebrow{font-size:12px;letter-spacing:2px;color:#b9d7ca}.hero h1{font-size:28px;margin:10px 0 8px}.hero p{font-size:14px;color:#d2e1db;margin:0;line-height:1.7;max-width:690px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.stat{background:#ffffff12;border:1px solid #ffffff25;border-radius:14px;padding:12px 14px}.stat strong{font-size:24px;display:block;color:#ffd0a5}.stat span{font-size:12px;color:#d2e1db}.panel{background:#fff;border-radius:0 0 22px 22px;padding:24px 26px 22px;box-shadow:0 16px 35px #1a403b14}.barhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.barhead h2{font-size:18px;margin:0}.switch{display:flex;gap:5px;background:#edf2ee;border-radius:12px;padding:4px}.switch button{border:0;border-radius:9px;background:transparent;padding:8px 15px;color:#60736c;font-weight:600;cursor:pointer}.switch button.active{background:#276c64;color:white;box-shadow:0 2px 7px #276c6430}#chartwrap{margin-top:14px;background:#fbfcfa;border:1px solid #e8eee9;border-radius:16px;padding:12px;position:relative}svg{width:100%;height:auto;display:block}.tip{position:absolute;display:none;pointer-events:none;background:#183f3b;color:white;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.6;box-shadow:0 5px 18px #183f3b30;z-index:2}.detail{display:flex;align-items:center;gap:10px;background:#f2f6f2;border-left:4px solid var(--orange);padding:13px 15px;border-radius:10px;margin-top:15px;font-size:13px;line-height:1.6;color:#52655e}.detail b{color:#244b45}.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:15px;font-size:11px;color:#89958f}.note{font-size:12px;color:#788780;margin-top:7px}@media(max-width:620px){body{padding:10px}.hero{padding:22px 18px}.hero h1{font-size:22px}.stats{grid-template-columns:1fr}.panel{padding:18px 14px}.barhead{align-items:flex-start} .switch button{padding:8px 10px}}
</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">SMART WATCH · USER INSIGHT</div><h1>用户真正偏好哪些功能？</h1><p>基于 50 份有效问卷，比较触控操作、语音助手、健康监测与 GPS 定位四项功能。切换人数或占比，悬停或点击柱形查看详情。</p><div class="stats"><div class="stat"><strong>32 人</strong><span>偏好人数最多：健康监测</span></div><div class="stat"><strong>64%</strong><span>健康监测功能占比</span></div><div class="stat"><strong>3 人</strong><span>最高与最低人数差距</span></div></div></header><main class="panel"><div class="barhead"><h2>四项核心功能偏好对比</h2><div class="switch"><button id="countBtn" class="active">人数</button><button id="pctBtn">占比</button></div></div><div id="chartwrap"><div id="tip" class="tip"></div><svg id="chart" viewBox="0 0 900 430" role="img" aria-label="智能手表功能偏好柱形图"></svg></div><div class="detail" id="detail"><b>数据提示</b><span>点击任意柱形，可在这里查看该功能的偏好人数和占比。</span></div><div class="note">注：占比 = 选择“是”的人数 ÷ 50；百分比四舍五入至整数。</div><div class="foot"><span>数据来源：用户偏好调查数据.xlsx（N=50）</span><span>HTML + SVG + 原生 JavaScript · 无外部依赖</span></div></main></div>
<script>
const rows=[{name:'触控操作',n:30,color:'#4e8b83'},{name:'语音助手',n:29,color:'#82a99b'},{name:'健康监测',n:32,color:'#e18c52'},{name:'GPS定位',n:31,color:'#527d9a'}];
let mode='count';const svg=document.getElementById('chart'),tip=document.getElementById('tip'),detail=document.getElementById('detail');
const NS='http://www.w3.org/2000/svg',W=900,H=430,m={l:72,r:28,t:34,b:82},pw=W-m.l-m.r,ph=H-m.t-m.b;
function el(tag,attrs={}){const x=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));return x}
function render(){svg.innerHTML='';const max=mode==='count'?40:80,ticks=mode==='count'?[0,10,20,30,40]:[0,20,40,60,80];
 ticks.forEach(v=>{let y=m.t+ph-v/max*ph;svg.appendChild(el('line',{x1:m.l,y1:y,x2:W-m.r,y2:y,stroke:'#e2e9e4','stroke-dasharray':'4 5'}));let t=el('text',{x:m.l-13,y:y+5,'text-anchor':'end','font-size':13,fill:'#83918a'});t.textContent=v;svg.appendChild(t)});
 let step=pw/rows.length,bw=112;rows.forEach((d,i)=>{let v=mode==='count'?d.n:Math.round(d.n/50*100),bh=v/max*ph,x=m.l+i*step+(step-bw)/2,y=m.t+ph-bh;
 let bar=el('rect',{x,y,width:bw,height:bh,rx:13,fill:d.color,opacity:.95,tabindex:0,role:'button','aria-label':`${d.name} ${d.n}人 ${Math.round(d.n/50*100)}%`});
 const show=(ev)=>{detail.innerHTML=`<b>${d.name}</b><span>偏好人数：${d.n} 人　｜　占比：${Math.round(d.n/50*100)}%</span>`;tip.style.display='block';let box=document.getElementById('chartwrap').getBoundingClientRect();let cx=ev.clientX-box.left,cy=ev.clientY-box.top;tip.style.left=Math.max(8,Math.min(box.width-170,cx+12))+'px';tip.style.top=Math.max(8,cy-58)+'px';tip.innerHTML=`${d.name}<br>${d.n} 人 · ${Math.round(d.n/50*100)}%`};
 bar.addEventListener('pointermove',show);bar.addEventListener('pointerleave',()=>tip.style.display='none');bar.addEventListener('click',show);bar.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(e)}});svg.appendChild(bar);
 let value=el('text',{x:x+bw/2,y:y-12,'text-anchor':'middle','font-size':16,'font-weight':700,fill:'#294b45'});value.textContent=mode==='count'?`${d.n}人`:`${Math.round(d.n/50*100)}%`;svg.appendChild(value);
 let lab=el('text',{x:x+bw/2,y:H-42,'text-anchor':'middle','font-size':15,fill:'#435d55'});lab.textContent=d.name;svg.appendChild(lab);
 });let axis=el('text',{x:18,y:m.t+ph/2,transform:`rotate(-90 18 ${m.t+ph/2})`,'text-anchor':'middle','font-size':13,fill:'#72827a'});axis.textContent=mode==='count'?'偏好人数（人）':'偏好占比（%）';svg.appendChild(axis);
}
function setMode(next){mode=next;document.getElementById('countBtn').classList.toggle('active',mode==='count');document.getElementById('pctBtn').classList.toggle('active',mode==='pct');render()}
document.getElementById('countBtn').addEventListener('click',()=>setMode('count'));document.getElementById('pctBtn').addEventListener('click',()=>setMode('pct'));render();
</script></body></html>
